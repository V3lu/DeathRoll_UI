<section class="hero is-fullheight is-dark" >
  <div class="columns is-vcentered">
    <div class="column">
      <div class="opponents">
        <article class="panel">
          <div class="panel-block">
            <p class="control has-icons-left">
              <input class="input is-hovered is-rounded is-link" type="text" placeholder="Filter by username" [value]="filter()" (keyup)="FilterBets($event)"/>
              <span class="icon is-left">
                <i class="fa fas fa-search" aria-hidden="true"></i>
              </span>
            </p>
          </div>
  
          @for (roll of similarRolls; track roll) {
            <div class="panel-block is-block">
              <div class="columns is-vcentered">
                <div class="column has-text-centered is-one-fifth">

                </div>
                <div class="column has-text-centered" id="opponents">
                  <strong>{{roll.username}}</strong>
                  {{roll.rollBase}}
                </div>
                <div class="column has-icons-right has-text-right is-one-fifth">
                  <div class="columns is-vcentered">
                    <div class="column">
                      
                    </div>
                    <div class="column has-icons-left has-text-left is-two-fifth">
                      <a>
                        <span class="icon is-small" style="font-size: 25px; color: white;">
                          <i class="fa fas fa-dice" aria-hidden="true" (click)="AcceptRoll(roll)"></i>
                        </span>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          }
        </article>
      </div>
    </div>
    <div class="column">
        <div class="rolls">
          <form [formGroup]="myForm" (ngSubmit)="PlaceRoll()">
            <div class="field">
                <p class="control has-icons-left has-icons-right">
                  <input formControlName="roll" class="input is-rounded is-link is-hovered" type="username" placeholder="ROLL">
                  <span class="icon is-small is-left">
                    <i class="fa fas fa-user"></i>
                  </span>
                </p>
              </div>
              <div class="field">
                <p class="control">
                  <button type="submit" class="button is-success" [disabled]="myForm.invalid">
                    Submit Roll
                  </button>
                </p>
              </div>
          </form>
        </div>
    </div>
    <div class="column">
        <div class="past">
            
        </div>
    </div>
  </div>
</section>

<div class="modal" id="modal2">
  <div class="modal-background"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title"><strong>Game with {{curentOpponentUsername}} has been started</strong></p>
      <button class="delete" aria-label="close" (click)="switchVis2()"></button>
    </header>
    <section class="modal-card-body">
      <button class="button is-warning" (click)="PlaceSubsequentRoll()">Roll</button>
    </section>
    <footer class="modal-card-foot">
      <div class="buttons">
        <button class="button is-warning" (click)="switchVis2()">Roll</button>
      </div>
    </footer>
  </div>
</div>
